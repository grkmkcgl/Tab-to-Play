name: Test

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  test:
    # Playwright 1.56 ubuntu-latest'e (26.04) tarayıcı kuramıyor; desteklediği sürüme sabit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  # Safari'nin motoru: `webkit: true` işaretli testler (açılış, çalma, egzersiz, plan, metronom, dar ekran)
  webkit:
    # Playwright 1.56 ubuntu-latest'e (26.04) tarayıcı kuramıyor; desteklediği sürüme sabit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run test:webkit
